# ============================================================
# 应用版本号 —— 发布新版本时只需修改此处
# ============================================================
#
# VERSION_CODE: 整数，必须单调递增。
#   Android 系统据此判断是否为新版本；若不增大，
#   已安装用户将无法覆盖安装（INSTALL_FAILED_VERSION_DOWNGRADE）。
#
# VERSION_NAME: 显示给用户的版本字符串，形如 1.0。
#
# 发布流程见 README「版本发布流程」：
#   改此处 → 提交 → 在同一个 commit 上打 v<版本名> tag。
#
VERSION_CODE=1
VERSION_NAME=1.0
