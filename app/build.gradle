plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batterymonitor.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.batterymonitor.app"
        minSdk 21
        targetSdk 34
        // 版本号集中维护在根目录 gradle.properties，发布时改那里，勿在构建脚本中写死
        versionCode project.VERSION_CODE.toInteger()
        versionName project.VERSION_NAME
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}